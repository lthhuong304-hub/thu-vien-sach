<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bambi's book (hưn˖°)</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root { --bg: #efe7d6; --card: #fbf6eb; --text: #2e241b; --muted: #786855; --accent: #7a2e2e; --gold: #c5a467; --border: #d8ccb4; }
    body.dark { --bg: #171412; --card: #221d19; --text: #e8decb; --muted: #a39582; --accent: #a85454; --gold: #8c7040; --border: #3a3128; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "EB Garamond", "Times New Roman", serif; background: var(--bg); background-image: radial-gradient(rgba(120,95,60,0.06) 1px, transparent 0); background-size: 22px 22px; color: var(--text); transition: 0.25s; }
    header { padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
    .brand { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
    .motto { font-size: 13px; font-style: italic; color: var(--muted); display: block; margin-top: 2px; }
    .controls, .tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tabs { padding: 16px 28px 6px; max-width: 1120px; margin: 0 auto; }
    button { cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 6px 14px; border-radius: 20px; font-size: 14px; font-family: inherit; transition: 0.2s; }
    button:hover { border-color: var(--gold); }
    button.primary, button.active { background: var(--accent); color: #fbf6eb; border-color: var(--accent); }
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 26px; padding: 16px 28px 50px; max-width: 1120px; margin: 0 auto; }
    .book-card { cursor: pointer; transition: transform 0.25s; }
    .book-card:hover { transform: translateY(-6px); }
    .cover { height: 235px; border-radius: 3px 10px 10px 3px; padding: 18px 16px; color: #fbf6eb; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; box-shadow: inset 12px 0 20px rgba(0,0,0,0.35), 6px 8px 18px rgba(40,25,10,0.22); background-size: cover; background-position: center; }
    .cover::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(229,198,135,0.45); border-radius: 2px 6px 6px 2px; pointer-events: none; z-index: 2; }
    .cover.has-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(20,12,6,0.75), rgba(20,12,6,0.15)); }
    .cover > * { position: relative; z-index: 3; }
    .cover h3 { margin: 0; font-size: 18px; line-height: 1.3; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    .book-meta { padding: 8px 2px; font-size: 13.5px; color: var(--muted); font-style: italic; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(20,14,8,0.6); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--card); color: var(--text); max-width: 480px; width: 100%; border-radius: 12px; padding: 24px; border: 1px solid var(--gold); max-height: 90vh; overflow-y: auto; }
    #reader { display: none; max-width: 1160px; margin: 0 auto; padding: 20px 24px 40px; }
    .reader-layout { display: flex; gap: 22px; align-items: flex-start; }
    .side-pill { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px solid var(--border); padding: 10px 7px; border-radius: 32px; box-shadow: 0 8px 24px rgba(40,25,10,0.12); z-index: 10; }
    .side-pill button { width: 38px; height: 38px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; border-color: transparent; background: transparent; }
    .side-pill button:hover { background: var(--bg); border-color: var(--gold); }
    .book-wrap { flex: 1; min-width: 0; }
    .reader-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    .book-spread { display: grid; grid-template-columns: 1fr 1fr; gap: 46px; background: var(--card); border-radius: 8px; padding: 34px 40px; min-height: 510px; box-shadow: 0 12px 32px rgba(40,25,10,0.14); border: 1px solid var(--border); outline: 1px solid var(--gold); outline-offset: -8px; position: relative; }
    .book-spread::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 28px; transform: translateX(-50%); background: linear-gradient(to right, transparent, rgba(60,40,20,0.08), transparent); pointer-events: none; }
    .ribbon { display: none; position: absolute; top: -6px; right: 44px; width: 18px; height: 42px; background: #8b2635; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); box-shadow: 0 3px 6px rgba(0,0,0,0.25); }
    .ribbon.show { display: block; }
    .chapter-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; text-align: center; }
    .page-content { font-size: 16px; line-height: 1.75; white-space: pre-line; text-align: justify; }
    .page-flip { animation: flipIn 0.25s ease; }
    @keyframes flipIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
    .reader-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; flex-wrap: wrap; gap: 8px; }
    @media (max-width: 820px) {
      .reader-layout { flex-direction: column; }
      .side-pill { position: static; flex-direction: row; width: 100%; justify-content: center; border-radius: 24px; padding: 6px 10px; }
      .book-spread { grid-template-columns: 1fr; padding: 24px; min-height: 380px; }
      .book-spread::after, #pageRightWrap { display: none; }
      .corner-charm { width: 64px !important; bottom: 10px !important; right: 10px !important; }
    }
    mark { border-radius: 3px; padding: 1px 2px; cursor: pointer; }
    .hl-yellow { background: #fff0a3; color: #222; } .hl-green { background: #c5f0c8; color: #222; }
    .hl-pink { background: #ffd1e6; color: #222; } .hl-blue { background: #c7e4ff; color: #222; }
    #hlBar { display: none; position: fixed; z-index: 60; background: var(--card); border: 1px solid var(--gold); padding: 6px 10px; border-radius: 24px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); gap: 6px; }
    #hlBar.show { display: flex; }
    .note-list { margin-top: 14px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; font-size: 14.5px; }
    .note-item { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
    input[type="text"], select { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 14.5px; margin-top: 6px; }
    /* Hình động chú nai nhỏ & ngôi sao góc trang */
    .corner-charm { position: fixed; bottom: 16px; right: 20px; width: 88px; pointer-events: none; z-index: 5; opacity: 0.88; }
    .deer-bob { animation: bob 3.4s ease-in-out infinite; transform-origin: center bottom; }
    .star-twinkle { animation: twinkle 2.2s ease-in-out infinite; transform-origin: center; }
    .star-twinkle-2 { animation: twinkle 2.8s ease-in-out 0.9s infinite; transform-origin: center; }
    @keyframes bob { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-4px) rotate(-1.5deg); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
    .corner-charm { cursor: pointer; pointer-events: auto !important; }
    .win-glow { animation: winGlow 3s ease-in-out infinite; }
    .snow-fall { animation: snowFall 3.5s linear infinite; }
    @keyframes winGlow { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }
    @keyframes snowFall { 0% { transform: translateY(-6px); opacity: 0; } 30% { opacity: 0.9; } 100% { transform: translateY(16px); opacity: 0; } }
  </style>
</head>
<body>
  <header>
    <div>
      <span class="brand">✦ bambi's book (hưn˖°) ✦</span>
      <span class="motto">per aspera, ad astra</span>
    </div>
    <div class="controls">
      <button onclick="openBookModal()">＋ Thêm sách (PDF / EPUB)</button>
      <button onclick="document.body.classList.toggle('dark')">☾ Sáng / Tối</button>
    </div>
  </header>

  <div id="libraryView">
    <div class="tabs" id="tabs"></div>
    <div class="shelf" id="shelf"></div>
  </div>

  <div id="reader">
    <div class="reader-layout">
      <div class="side-pill" title="Thanh công cụ">
        <button onclick="closeReader()" title="Về kệ sách">←</button>
        <button onclick="changeFont(-1)" title="Chữ nhỏ hơn">A-</button>
        <button onclick="changeFont(1)" title="Chữ lớn hơn">A+</button>
        <button onclick="saveBookmark()" title="Đánh dấu trang">🔖</button>
        <button onclick="goBookmark()" title="Đi tới dấu trang">↪</button>
        <button onclick="clearBookmark()" title="Bỏ dấu trang">✕</button>
        <button onclick="document.body.classList.toggle('dark')" title="Sáng / Tối">☾</button>
      </div>
      <div class="book-wrap">
        <div class="reader-head">
          <select id="chapterSelect" onchange="goChapter(this.value)" style="width:auto; max-width:300px; margin:0;"></select>
          <span id="readTime" style="font-size:14px; color:var(--accent); font-weight:600;">⏱ 00:00</span>
        </div>
        <div class="book-spread" id="bookSpread">
          <div class="ribbon" id="ribbonMark"></div>
          <div class="page-col">
            <div class="chapter-title" id="chTitleLeft"></div>
            <div class="page-content" id="pageLeft"></div>
          </div>
          <div class="page-col" id="pageRightWrap">
            <div class="chapter-title" id="chTitleRight"></div>
            <div class="page-content" id="pageRight"></div>
          </div>
        </div>
        <div class="reader-bottom">
          <button onclick="turnPage(-1)">◀ Trang trước</button>
          <span id="pageInfo" style="font-size:14px; color:var(--muted); font-style:italic;"></span>
          <button onclick="turnPage(1)">Trang sau ▶</button>
        </div>
        <div class="note-list" id="noteList" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div id="hlBar">
    <button onclick="applyHL('yellow')">🍰</button><button onclick="applyHL('green')">☕</button>
    <button onclick="applyHL('pink')">🌸</button><button onclick="applyHL('blue')">🔖</button>
    <button onclick="hideHLBar()">✕</button>
  </div>

  <input type="file" id="changeCoverInput" accept="image/*" hidden>
  <div class="modal-bg" id="previewModal"><div class="modal" id="previewBody"></div></div>

  <div class="modal-bg" id="bookModal">
    <div class="modal">
      <h3 style="margin-top:0;">✦ Thêm sách PDF hoặc EPUB</h3>
      <p style="font-size:14px; color:var(--muted);">Sách lưu trực tiếp trên trình duyệt này (không tải lên máy chủ).</p>
      <label style="font-size:13.5px;">Chọn file sách (.pdf hoặc .epub):</label>
      <input type="file" id="bookFile" accept=".pdf,.epub,application/pdf,application/epub+zip" style="margin:4px 0 10px; display:block;">
      <label style="font-size:13.5px;">Chọn ảnh bìa (không bắt buộc):</label>
      <input type="file" id="bookCover" accept="image/*" style="margin:4px 0 10px; display:block;">
      <input type="text" id="bookTitle" placeholder="Tên sách (bỏ trống để tự lấy từ file)...">
      <input type="text" id="bookAuthor" placeholder="Tên tác giả...">
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
        <button onclick="closeModal('bookModal')">Đóng</button>
        <button class="primary" id="saveBookBtn" onclick="importBook()">✓ Lưu vào kệ</button>
      </div>
    </div>
  </div>

<!-- Bộ 3 hình động cổ tích ở góc (bấm vào để đổi hình) -->
  <div class="corner-charm" onclick="nextCharm()" title="Bấm để đổi hình cổ tích">
    <svg id="charm0" viewBox="0 0 110 100" fill="none">
      <path class="star-twinkle" d="M22 18 L24 23 L29 25 L24 27 L22 32 L20 27 L15 25 L20 23 Z" fill="#c5a467"/>
      <path class="star-twinkle-2" d="M84 14 L85.5 18 L89.5 19.5 L85.5 21 L84 25 L82.5 21 L78.5 19.5 L82.5 18 Z" fill="#c5a467"/>
      <g class="deer-bob">
        <ellipse cx="66" cy="64" rx="17" ry="10.5" fill="#b68052"/>
        <path d="M53 72 L51 88 M59 73 L59 88 M72 73 L72 88 M78 72 L80 88" stroke="#9d6b41" stroke-width="3" stroke-linecap="round"/>
        <path d="M82 59 Q88 53 84 49" stroke="#b68052" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M53 58 Q46 49 42 46" stroke="#b68052" stroke-width="7.5" stroke-linecap="round"/>
        <ellipse cx="38" cy="46" rx="9.5" ry="6.5" transform="rotate(-15 38 46)" fill="#c48f60"/>
        <ellipse cx="44" cy="38" rx="2.6" ry="5.5" transform="rotate(15 44 38)" fill="#b68052"/>
        <circle cx="35" cy="45" r="1.5" fill="#2e241b"/>
        <circle cx="29" cy="48" r="1.6" fill="#5c3822"/>
        <circle cx="62" cy="61" r="1.5" fill="#f5e6cc"/><circle cx="68" cy="64" r="1.4" fill="#f5e6cc"/><circle cx="74" cy="61" r="1.3" fill="#f5e6cc"/>
      </g>
      <g class="deer-bob" style="animation-delay:0.5s">
        <ellipse cx="18" cy="79" rx="6.5" ry="8" fill="#e8dfd1" stroke="#9d8b76" stroke-width="1"/>
        <circle cx="18" cy="69" r="5" fill="#f2ebe0" stroke="#9d8b76" stroke-width="1"/>
        <ellipse cx="15" cy="62" rx="1.8" ry="4.5" transform="rotate(-15 15 62)" fill="#e8dfd1" stroke="#9d8b76" stroke-width="1"/>

      </g>
    </svg>

    <svg id="charm1" viewBox="0 0 110 100" fill="none" style="display:none">
      <rect x="14" y="46" width="24" height="42" fill="#8b96a3" stroke="#4a443c" stroke-width="1.2"/>
      <polygon points="12,46 26,32 40,46" fill="#6f7882" stroke="#4a443c" stroke-width="1.2"/>
      <rect x="38" y="38" width="28" height="50" fill="#a89f91" stroke="#4a443c" stroke-width="1.2"/>
      <polygon points="36,38 52,22 68,38" fill="#7c6e63" stroke="#4a443c" stroke-width="1.2"/>
      <rect x="66" y="48" width="26" height="40" fill="#929c97" stroke="#4a443c" stroke-width="1.2"/>
      <polygon points="64,48 79,34 94,48" fill="#6b736f" stroke="#4a443c" stroke-width="1.2"/>
      <rect x="20" y="26" width="5" height="10" fill="#6f7882"/><rect x="56" y="18" width="6" height="12" fill="#7c6e63"/>
      <rect class="win-glow" x="21" y="56" width="8" height="11" rx="1" fill="#f4b956"/>
      <rect class="win-glow" style="animation-delay:1s" x="48" y="50" width="8" height="12" rx="1" fill="#f4b956"/>
      <rect class="win-glow" style="animation-delay:0.4s" x="75" y="60" width="8" height="12" rx="1" fill="#f4b956"/>
      <path d="M10 88 L98 88" stroke="#4a443c" stroke-width="2" stroke-linecap="round"/>

    <svg id="charm2" viewBox="0 0 110 100" fill="none" style="display:none">
      <ellipse cx="55" cy="87" rx="34" ry="5" fill="#d9e2e8"/>
      <rect x="51" y="30" width="7" height="56" rx="2" fill="#6b4c35"/>
      <polygon points="24,34 64,28 66,38 26,44" fill="#8b6547" stroke="#4a3322" stroke-width="1"/>
      <polygon points="44,46 86,52 84,62 42,56" fill="#7a563b" stroke="#4a3322" stroke-width="1"/>
      <path d="M24 34 Q44 29 64 28" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <path d="M44 46 Q65 48 86 52" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle class="snow-fall" cx="26" cy="22" r="2" fill="#ffffff"/>
      <circle class="snow-fall" style="animation-delay:1.1s" cx="76" cy="20" r="2.2" fill="#ffffff"/>
      <circle class="snow-fall" style="animation-delay:2.2s" cx="42" cy="64" r="1.8" fill="#ffffff"/>

    </svg>
  </div>

  <script src="books.js"></script>
  <script>
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let userBooks = [], currentCat = "Tất cả", currentBook = null, chIdx = 0, pageIdx = 0, pages = [], selectedText = "", activeHlPage = 0, fontSize = 16, readSec = 0, readTimer = null;
    const cats = ["Tất cả", "Của tôi", "Bạn bè", "Sách hay", "Sách của bạn"];
    const isSpread = () => window.innerWidth > 820;
    const readImage = f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });

    function openDB() {
      return new Promise((res, rej) => {
        const r = indexedDB.open("MyLibraryDB", 1);
        r.onupgradeneeded = e => e.target.result.createObjectStore("books", { keyPath: "id" });
        r.onsuccess = e => res(e.target.result); r.onerror = rej;
      });
    }
    async function loadUserBooks() {
      const db = await openDB();
      db.transaction("books", "readonly").objectStore("books").getAll().onsuccess = e => { userBooks = e.target.result || []; renderShelf(); };
    }
    async function saveUserBook(b) { (await openDB()).transaction("books", "readwrite").objectStore("books").put(b); }
    async function removeUserBook(id) {
      (await openDB()).transaction("books", "readwrite").objectStore("books").delete(id);
      userBooks = userBooks.filter(b => b.id !== id); closeModal("previewModal"); renderShelf();
    }
    function triggerChangeCover(id) {
      const inp = document.getElementById("changeCoverInput");
      inp.onchange = async () => {
        if (!inp.files[0]) return;
        const b = userBooks.find(x => x.id === id);
        b.cover = await readImage(inp.files[0]);
        await saveUserBook(b); renderShelf(); openPreview(id); inp.value = "";
      };
      inp.click();
    }

    function allBooks() { return [...(typeof BOOKS !== "undefined" ? BOOKS : []), ...userBooks]; }
    function renderTabs() {
      document.getElementById("tabs").innerHTML = cats.map(c =>
        `<button class="${c === currentCat ? 'active' : ''}" onclick="currentCat='${c}';renderTabs();renderShelf();">${c}</button>`
      ).join("");
    }
    function renderShelf() {
      const list = currentCat === "Tất cả" ? allBooks() : allBooks().filter(b => b.category === currentCat);
      document.getElementById("shelf").innerHTML = list.length ? list.map(b => `
        <div class="book-card" onclick="openPreview('${b.id}')">
          <div class="cover ${b.cover ? 'has-img' : ''}" style="${b.cover ? `background-image:url('${b.cover}')` : `background:${b.color || '#2c5e4f'}`}">
            <h3>${b.title}</h3><small>✦ ${b.author}</small>
          </div>
          <div class="book-meta">${b.category} · ${b.year || ''}</div>
        </div>`).join("") : `<p style="color:var(--muted);">Chưa có sách trong mục này.</p>`;
    }

    function fmtTime(s) {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60, pad = n => String(n).padStart(2, "0");
      return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
    }
    function openPreview(id) {
      const b = allBooks().find(x => x.id === id), rc = localStorage.getItem("recent_" + id), t = Number(localStorage.getItem("time_" + id) || 0);
      document.getElementById("previewBody").innerHTML = `
        <h2 style="margin-top:0;">${b.title}</h2>
        <p style="color:var(--muted);">Tác giả: <strong>${b.author}</strong> · ${b.year || ''}</p>
        <p style="line-height:1.65;">${b.description || 'Tác phẩm lưu trữ trong thư viện cá nhân.'}</p>
        ${rc ? `<p style="font-size:14px; color:var(--accent);">📖 Đọc gần đây: Chương ${JSON.parse(rc).ch + 1}, Trang ${JSON.parse(rc).p + 1} · ⏱ ${fmtTime(t)}</p>` : ''}
        <div style="display:flex; justify-content:space-between; margin-top:20px; gap:6px; flex-wrap:wrap;">
          ${b.isLocal ? `<div style="display:flex; gap:6px;"><button onclick="triggerChangeCover('${b.id}')">🖼 Đổi bìa</button><button onclick="removeUserBook('${b.id}')" style="color:#a83232;">Xóa</button></div>` : ''}
          <div style="display:flex; gap:8px; margin-left:auto;">
            <button onclick="closeModal('previewModal')">Đóng</button>
            <button class="primary" onclick="closeModal('previewModal');startReading('${b.id}')">Đọc ngay</button>
          </div>
        </div>`;
      document.getElementById("previewModal").classList.add("open");
    }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }
    function openBookModal() { document.getElementById("bookModal").classList.add("open"); }

    function paginate(text, maxWords = 230) {
      const paras = (text || "").split(/\n+/).map(p => p.trim()).filter(Boolean), out = [];
      let cur = [], count = 0;
      for (const p of paras) {
        const wc = p.split(/\s+/).length;
        if (count + wc > maxWords && cur.length) { out.push(cur.join("\n\n")); cur = []; count = 0; }
        cur.push(p); count += wc;
      }
      if (cur.length) out.push(cur.join("\n\n"));
      return out.length ? out : [""];
    }

    function startReading(id) {
      currentBook = allBooks().find(b => b.id === id);
      const sv = JSON.parse(localStorage.getItem("recent_" + id) || '{"ch":0,"p":0}');
      chIdx = Math.min(sv.ch, currentBook.chapters.length - 1); pageIdx = sv.p;
      document.getElementById("chapterSelect").innerHTML = currentBook.chapters.map((c, i) => `<option value="${i}">${c.title}</option>`).join("");
      document.getElementById("libraryView").style.display = "none";
      document.getElementById("reader").style.display = "block";
      readSec = Number(localStorage.getItem("time_" + id) || 0);
      document.getElementById("readTime").textContent = "⏱ " + fmtTime(readSec);
      clearInterval(readTimer);
      readTimer = setInterval(() => {
        readSec++; document.getElementById("readTime").textContent = "⏱ " + fmtTime(readSec);
        if (readSec % 5 === 0) localStorage.setItem("time_" + currentBook.id, readSec);
      }, 1000);
      renderPage();
    }

    const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const getHLKey = p => `hl_${currentBook.id}_${chIdx}_${p}`;

    function renderHalf(pIdx, elId) {
      if (pIdx >= pages.length) { document.getElementById(elId).innerHTML = ""; return []; }
      let html = esc(pages[pIdx]);
      const hls = JSON.parse(localStorage.getItem(getHLKey(pIdx)) || "[]");
      hls.forEach((h, i) => {
        const s = esc(h.text);
        if (html.includes(s)) html = html.replace(s, `<mark class="hl-${h.color}" onclick="deleteHL(${pIdx},${i})" title="Bấm để xóa">${s}${h.note ? ' 📝' : ''}</mark>`);
      });
      document.getElementById(elId).innerHTML = html;
      return hls.map((h, i) => ({...h, idx: i, p: pIdx})).filter(h => h.note);
    }

    function renderPage() {
      document.getElementById("chapterSelect").value = chIdx;
      const ch = currentBook.chapters[chIdx]; pages = paginate(ch.content);
      if (pageIdx >= pages.length) pageIdx = 0;
      if (isSpread() && pageIdx % 2 === 1) pageIdx--;
      document.getElementById("chTitleLeft").textContent = `${currentBook.title} — ${ch.title}`;
      document.getElementById("chTitleRight").textContent = isSpread() && pageIdx + 1 < pages.length ? `✦ Trang ${pageIdx + 2} ✦` : "";
      const notes1 = renderHalf(pageIdx, "pageLeft"), notes2 = isSpread() ? renderHalf(pageIdx + 1, "pageRight") : [];
      const sp = document.getElementById("bookSpread"); sp.classList.remove("page-flip"); void sp.offsetWidth; sp.classList.add("page-flip");
      document.getElementById("pageInfo").textContent = isSpread() && pageIdx + 1 < pages.length ? `Trang ${pageIdx + 1}–${pageIdx + 2} / ${pages.length}` : `Trang ${pageIdx + 1} / ${pages.length}`;
      localStorage.setItem("recent_" + currentBook.id, JSON.stringify({ ch: chIdx, p: pageIdx }));
      const bm = JSON.parse(localStorage.getItem("bm_" + currentBook.id) || "null");
      document.getElementById("ribbonMark").classList.toggle("show", Boolean(bm && bm.ch === chIdx && (bm.p === pageIdx || (isSpread() && bm.p === pageIdx + 1))));
      const box = document.getElementById("noteList"), notes = [...notes1, ...notes2];
      box.style.display = notes.length ? "block" : "none";
      box.innerHTML = notes.length ? `<strong>✎ Ghi chú trang này:</strong>` + notes.map(h => `<div class="note-item"><span>"${h.text.slice(0,40)}..." → <em>${h.note}</em></span><button onclick="deleteHL(${h.p},${h.idx})">✕</button></div>`).join("") : "";
    }

    function changeFont(d) { fontSize = Math.max(13, Math.min(24, fontSize + d)); document.querySelectorAll(".page-content").forEach(el => el.style.fontSize = fontSize + "px"); }
    function goChapter(i) { chIdx = Number(i); pageIdx = 0; renderPage(); }
    function turnPage(d) {
      const step = isSpread() ? 2 : 1;
      if (pageIdx + d * step >= 0 && pageIdx + d * step < pages.length) pageIdx += d * step;
      else if (d > 0 && chIdx + 1 < currentBook.chapters.length) { chIdx++; pageIdx = 0; }
      else if (d < 0 && chIdx > 0) { chIdx--; pages = paginate(currentBook.chapters[chIdx].content); pageIdx = Math.max(0, pages.length - (isSpread() ? 2 : 1)); }
      else return;
      renderPage(); window.scrollTo({top: 0, behavior: 'smooth'});
    }
    function closeReader() {
      clearInterval(readTimer); if (currentBook) localStorage.setItem("time_" + currentBook.id, readSec);
      document.getElementById("reader").style.display = "none"; document.getElementById("libraryView").style.display = "block"; renderShelf();
    }

    function saveBookmark() {
      const note = prompt("Ghi chú cho dấu trang:", "") || "";
      localStorage.setItem("bm_" + currentBook.id, JSON.stringify({ ch: chIdx, p: pageIdx, note })); renderPage();
    }
    function goBookmark() {
      const bm = JSON.parse(localStorage.getItem("bm_" + currentBook.id) || "null");
      if (!bm) return alert("Chưa có dấu trang nào.");
      chIdx = bm.ch; pageIdx = bm.p; renderPage(); if (bm.note) alert("✎ Ghi chú: " + bm.note);
    }
    function clearBookmark() { localStorage.removeItem("bm_" + currentBook.id); renderPage(); }

    ["pageLeft", "pageRight"].forEach((id, offset) => {
      document.getElementById(id).addEventListener("mouseup", e => {
        const sel = window.getSelection().toString().trim();
        if (sel.length > 1) {
          selectedText = sel; activeHlPage = pageIdx + offset;
          const bar = document.getElementById("hlBar");
          bar.style.left = Math.min(e.clientX, window.innerWidth - 220) + "px";
          bar.style.top = Math.max(10, e.clientY - 48) + "px";
          bar.classList.add("show");
        }
      });
    });
    function hideHLBar() { document.getElementById("hlBar").classList.remove("show"); }
    function applyHL(color) {
      const note = prompt("Thêm ghi chú (bỏ trống nếu chỉ tô màu):", "") || "";
      const hls = JSON.parse(localStorage.getItem(getHLKey(activeHlPage)) || "[]");
      hls.push({ text: selectedText, color, note });
      localStorage.setItem(getHLKey(activeHlPage), JSON.stringify(hls));
      hideHLBar(); window.getSelection().removeAllRanges(); renderPage();
    }
    function deleteHL(p, idx) {
      if (!confirm("Xóa highlight và ghi chú này?")) return;
      const hls = JSON.parse(localStorage.getItem(getHLKey(p)) || "[]");
      hls.splice(idx, 1); localStorage.setItem(getHLKey(p), JSON.stringify(hls)); renderPage();
    }

    async function parseEPUB(file) {
      const zip = await JSZip.loadAsync(await file.arrayBuffer()), dp = new DOMParser();
      let opfPath = null;
      const cf = zip.file("META-INF/container.xml");
      if (cf) opfPath = dp.parseFromString(await cf.async("string"), "text/xml").querySelector("rootfile")?.getAttribute("full-path");
      if (!opfPath) opfPath = Object.keys(zip.files).find(k => k.endsWith(".opf"));
      const base = opfPath && opfPath.includes("/") ? opfPath.slice(0, opfPath.lastIndexOf("/") + 1) : "";
      const opf = dp.parseFromString(await zip.file(opfPath).async("string"), "text/xml");
      const autoTitle = opf.getElementsByTagName("dc:title")[0]?.textContent.trim() || "";
      const autoAuthor = opf.getElementsByTagName("dc:creator")[0]?.textContent.trim() || "";
      const man = {}; opf.querySelectorAll("manifest > item").forEach(it => man[it.getAttribute("id")] = decodeURIComponent(it.getAttribute("href") || ""));
      const chapters = [];
      for (const ir of opf.querySelectorAll("spine > itemref")) {
        if (ir.getAttribute("linear") === "no") continue;
        const href = man[ir.getAttribute("idref")], entry = href && (zip.file(base + href) || zip.file(href));
        if (!entry) continue;
        const doc = dp.parseFromString(await entry.async("string"), "text/html");
        const title = doc.querySelector("h1, h2, h3, title")?.textContent.trim().slice(0, 80) || `Chương ${chapters.length + 1}`;
        const paras = Array.from(doc.querySelectorAll("p, h1, h2, h3, h4, li, div")).filter(el => !el.querySelector("p, div")).map(el => el.textContent.trim()).filter(Boolean);
        const text = paras.length ? paras.join("\n\n") : (doc.body?.textContent.trim() || "");
        if (text.length > 20) chapters.push({ title, content: text });
      }
      return { autoTitle, autoAuthor, chapters };
    }

    async function importBook() {
      const file = document.getElementById("bookFile").files[0];
      if (!file) return alert("Vui lòng chọn file .pdf hoặc .epub!");
      const btn = document.getElementById("saveBookBtn"); btn.textContent = "Đang xử lý...";
      try {
        let chapters = [], autoTitle = "", autoAuthor = "";
        if (file.name.toLowerCase().endsWith(".epub")) ({ autoTitle, autoAuthor, chapters } = await parseEPUB(file));
        else {
          const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
          let txt = "";
          for (let i = 1; i <= pdf.numPages; i++) txt += (await (await pdf.getPage(i)).getTextContent()).items.map(x => x.str).join(" ") + "\n\n";
          chapters = [{ title: "Toàn văn", content: txt }];
        }
        if (!chapters.length) throw new Error("Empty");
        const coverFile = document.getElementById("bookCover").files[0];
        const book = {
          id: "local_" + Date.now(), isLocal: true, category: "Sách của bạn", year: new Date().getFullYear(), color: "#5c3d2e",
          cover: coverFile ? await readImage(coverFile) : "",
          title: document.getElementById("bookTitle").value.trim() || autoTitle || file.name.replace(/\.(pdf|epub)$/i, ""),
          author: document.getElementById("bookAuthor").value.trim() || autoAuthor || "Cá nhân",
          chapters
        };
        await saveUserBook(book); userBooks.push(book); closeModal("bookModal");
        currentCat = "Sách của bạn"; renderTabs(); renderShelf();
      } catch (e) { alert("Không đọc được file này (với PDF hãy chắc chắn là PDF có chữ, không phải ảnh scan)."); }
      btn.textContent = "✓ Lưu vào kệ";
    }

    document.addEventListener("keydown", e => {
      if (document.getElementById("reader").style.display === "block") {
        if (e.key === "ArrowRight") turnPage(1); if (e.key === "ArrowLeft") turnPage(-1);
      }
    });

    renderTabs(); renderShelf(); loadUserBooks();
    let charmIdx = 0;
 function nextCharm() {
   charmIdx = (charmIdx + 1) % 3;
   [0, 1, 2].forEach(i => document.getElementById("charm" + i).style.display = i === charmIdx ? "block" : "none");
 }
  </script>
